<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Буква T из логотипа в хедере: та же гарнитура и тот же вес,
       Roboto Mono 500. Глиф переведён в контур, а не задан текстом:
       фавикон рисуется без веб-шрифтов, и <text> подменился бы системным
       моноширинным. Высота буквы — 19 из 32, поля сверху и снизу по 6.5:
       на мелком размере знак читается, но не упирается в скругления. -->
  <rect width="32" height="32" rx="7" fill="#080A00"/>
  <path d="M23.399 9.097L23.399 6.5L8.601 6.5L8.601 9.097L14.421 9.097L14.421 25.5L17.54 25.5L17.54 9.097L23.399 9.097Z" fill="#E6E6E6"/>
